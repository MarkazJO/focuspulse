<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FocusPulse">
    <meta name="theme-color" content="#000000">
    <title>FocusPulse</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-black: #000000;
            --apple-grouped-bg: #1c1c1e;
            --apple-secondary-grouped: #2c2c2e;
            --apple-tertiary-grouped: #3a3a3c;
            --apple-orange: #ff9f0a;
            --apple-green: #34c759;
            --apple-red: #ff453a;
            --apple-blue: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --apple-separator: rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top, 24px);
            --safe-bottom: env(safe-area-inset-bottom, 24px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, button {
            user-select: auto;
            -webkit-user-select: auto;
            font-family: inherit;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--safe-bottom) + 24px);
        }

        /* Apple Navigation Bar */
        header {
            padding: 10px 20px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-icon {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: linear-gradient(135deg, #ff9f0a, #ff6b00);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        .nav-icon svg {
            width: 15px;
            height: 15px;
        }

        .nav-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cloud-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .cloud-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8e8e93;
        }

        .cloud-dot.online {
            background: var(--apple-green);
            box-shadow: 0 0 6px rgba(52, 199, 89, 0.6);
        }

        .cloud-dot.syncing {
            background: var(--apple-orange);
            animation: pulse 1s infinite;
        }

        .cloud-dot.offline {
            background: var(--apple-red);
        }

        .btn-settings-icon {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            cursor: pointer;
        }

        .btn-settings-icon svg {
            width: 20px;
            height: 20px;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
            max-width: 460px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 16px 0;
        }

        /* Apple Clock Timer Dial Section */
        .timer-display-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 6px;
            position: relative;
        }

        .dial-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dial-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .dial-track {
            fill: none;
            stroke: #1c1c1e;
            stroke-width: 6;
        }

        .dial-fill {
            fill: none;
            stroke: var(--apple-orange);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 753.98;
            stroke-dashoffset: 753.98;
            transition: stroke-dashoffset 0.3s ease;
        }

        .dial-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
        }

        .dial-subhead {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .dial-time {
            font-size: 48px;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1.5px;
            color: var(--text-primary);
            line-height: 1;
        }

        .dial-status-line {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        .dial-status-line svg {
            width: 12px;
            height: 12px;
            color: var(--apple-orange);
        }

        /* Apple Clock Double-Ring Circular Action Buttons */
        .apple-buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 6px;
            padding: 0 10px;
        }

        .apple-circle-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            position: relative;
        }

        .apple-circle-btn:active {
            transform: scale(0.94);
        }

        .apple-circle-btn.btn-pause {
            background-color: rgba(255, 159, 10, 0.20);
            border-color: rgba(255, 159, 10, 0.40);
            color: var(--apple-orange);
        }

        .apple-circle-btn.btn-pause.disabled {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.10);
            color: var(--text-tertiary);
            pointer-events: none;
            opacity: 0.5;
        }

        .apple-circle-btn.btn-start {
            background-color: rgba(52, 199, 89, 0.20);
            border-color: rgba(52, 199, 89, 0.40);
            color: var(--apple-green);
        }

        .apple-circle-btn.btn-start.running {
            background-color: rgba(255, 69, 58, 0.20);
            border-color: rgba(255, 69, 58, 0.40);
            color: var(--apple-red);
        }

        /* Apple Inset Grouped Section for History */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .section-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .section-header-title {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: -0.08px;
            color: var(--text-secondary);
        }

        .btn-add-text {
            background: transparent;
            border: none;
            color: var(--apple-orange);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .btn-add-text svg {
            width: 14px;
            height: 14px;
        }

        /* Inset Group Container */
        .inset-group {
            background: var(--apple-grouped-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .group-date-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 10px 16px 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Group Row Item */
        .apple-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            position: relative;
            cursor: pointer;
            transition: background 0.15s;
        }

        .apple-row:active {
            background: rgba(255, 255, 255, 0.06);
        }

        .apple-row:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 54px;
            right: 0;
            bottom: 0;
            height: 0.5px;
            background: var(--apple-separator);
        }

        .row-icon-squircle {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: rgba(255, 159, 10, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--apple-orange);
            flex-shrink: 0;
            margin-right: 12px;
        }

        .row-icon-squircle svg {
            width: 16px;
            height: 16px;
        }

        .row-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .row-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .row-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .row-badge {
            font-size: 14px;
            font-weight: 600;
            color: var(--apple-orange);
            font-variant-numeric: tabular-nums;
        }

        .row-chevron {
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
        }

        .row-chevron svg {
            width: 14px;
            height: 14px;
        }

        .empty-row {
            padding: 24px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Apple Modal Sheet */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.22s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-sheet {
            background: #1c1c1e;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 12px 18px calc(var(--safe-bottom) + 16px);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.7);
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 5px;
            background: #3a3a3c;
            border-radius: 3px;
            margin: 0 auto 14px;
        }

        .modal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-nav-title {
            font-size: 17px;
            font-weight: 600;
        }

        .modal-nav-btn {
            background: transparent;
            border: none;
            color: var(--apple-orange);
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
        }

        .modal-nav-btn.bold {
            font-weight: 600;
        }

        .sheet-card-group {
            background: var(--apple-secondary-grouped);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .sheet-field-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            position: relative;
        }

        .sheet-field-row:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 14px;
            right: 0;
            bottom: 0;
            height: 0.5px;
            background: var(--apple-separator);
        }

        .sheet-field-label {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-primary);
        }

        .sheet-field-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            text-align: right;
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        /* Steppers */
        .stepper-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 14px 14px;
        }

        .stepper-chip {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 10px;
            cursor: pointer;
        }

        .stepper-chip:active {
            background: var(--apple-orange);
            color: #000;
        }

        .btn-sheet-delete {
            width: 100%;
            height: 46px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--apple-red);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-sheet-delete:active {
            background: rgba(255, 69, 58, 0.12);
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }
    </style>
</head>
<body>
    <!-- Top Apple Nav Bar -->
    <header>
        <div class="nav-title-group">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 14h-2V8h2v8zm-1-10c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"/></svg>
            </div>
            <span class="nav-title">FocusPulse</span>
        </div>

        <div class="nav-actions">
            <div class="cloud-pill" id="cloudStatusBadge" onclick="toggleSettingsModal()">
                <div class="cloud-dot" id="cloudStatusDot"></div>
                <span id="cloudStatusText">Syncing...</span>
            </div>
            <button class="btn-settings-icon" onclick="toggleSettingsModal()" title="Settings">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Apple Clock Circular Dial Timer -->
        <section class="timer-display-section">
            <div class="dial-container">
                <svg class="dial-svg" viewBox="0 0 260 260">
                    <circle class="dial-track" cx="130" cy="130" r="120" />
                    <circle class="dial-fill" id="dialFill" cx="130" cy="130" r="120" />
                </svg>

                <div class="dial-content">
                    <span class="dial-subhead">Remaining Today</span>
                    <span class="dial-time" id="dialTime">10:44:00</span>
                    <div class="dial-status-line" id="dialStatusLine">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        <span id="dialStatusText">Goal: 10h 44m</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Apple Double-Ring Circular Action Buttons: Pause & Start -->
        <section class="apple-buttons-row">
            <button class="apple-circle-btn btn-pause disabled" id="btnPause" onclick="handlePause()">
                <span>Pause</span>
            </button>
            <button class="apple-circle-btn btn-start" id="btnStart" onclick="handleStart()">
                <span id="btnStartText">Start</span>
            </button>
        </section>

        <!-- Session History (Apple Inset Grouped Table View) -->
        <section class="history-section">
            <div class="section-header-row">
                <span class="section-header-title">Session History</span>
                <button class="btn-add-text" onclick="openAddSessionModal()">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Add</span>
                </button>
            </div>

            <div class="inset-group" id="historyGroup">
                <!-- Grouped log entries dynamically populated -->
            </div>
        </section>
    </main>

    <!-- Apple iOS Modal Sheet for Edit / Add -->
    <div class="modal-overlay" id="sessionModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>

            <div class="modal-nav">
                <button class="modal-nav-btn" onclick="closeSessionModal()">Cancel</button>
                <span class="modal-nav-title" id="modalTitle">Edit Session</span>
                <button class="modal-nav-btn bold" onclick="saveSessionModal()">Done</button>
            </div>

            <input type="hidden" id="editSessionId">

            <div class="sheet-card-group">
                <div class="sheet-field-row">
                    <span class="sheet-field-label">Title</span>
                    <input type="text" class="sheet-field-input" id="modalSessionTitle" placeholder="Work Session">
                </div>
                <div class="sheet-field-row">
                    <span class="sheet-field-label">Date</span>
                    <input type="date" class="sheet-field-input" id="modalSessionDate">
                </div>
                <div class="sheet-field-row">
                    <span class="sheet-field-label">Start Time</span>
                    <input type="time" step="1" class="sheet-field-input" id="modalStartTime" onchange="onModalTimeInputChanged()">
                </div>
                <div class="sheet-field-row">
                    <span class="sheet-field-label">End Time</span>
                    <input type="time" step="1" class="sheet-field-input" id="modalEndTime" onchange="onModalTimeInputChanged()">
                </div>
                <div class="sheet-field-row">
                    <span class="sheet-field-label">Duration</span>
                    <span class="sheet-field-input" id="modalDurationPreview" style="color: var(--apple-orange); font-weight: 600;">0m</span>
                </div>
            </div>

            <div class="sheet-card-group">
                <div class="sheet-field-row" style="padding-bottom: 4px;">
                    <span class="sheet-field-label" style="font-size: 13px; color: var(--text-secondary);">Adjust End Time ("Go back in time")</span>
                </div>
                <div class="stepper-chips">
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(-15)">-15m</button>
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(-5)">-5m</button>
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(-1)">-1m</button>
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(1)">+1m</button>
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(5)">+5m</button>
                    <button type="button" class="stepper-chip" onclick="adjustModalEndTime(15)">+15m</button>
                </div>
            </div>

            <button class="btn-sheet-delete" id="btnModalDelete" onclick="deleteSessionFromModal()">Delete Session</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>

            <div class="modal-nav">
                <button class="modal-nav-btn" onclick="toggleSettingsModal()">Cancel</button>
                <span class="modal-nav-title">Cloud Settings</span>
                <button class="modal-nav-btn bold" onclick="saveFirebaseSettings()">Save</button>
            </div>

            <div class="sheet-card-group">
                <div class="sheet-field-row">
                    <span class="sheet-field-label">Firebase URL</span>
                    <input type="text" class="sheet-field-input" id="inputFirebaseUrl" placeholder="https://..." style="text-align: left; width: 65%;">
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Service Worker registration with auto-reload
        if ('serviceWorker' in navigator) {
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=11').then(reg => {
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (!refreshing) {
                                    refreshing = true;
                                    window.location.reload();
                                }
                            }
                        });
                    });
                }).catch(() => {});
            });
        }

        function haptic() {
            try {
                if (navigator.vibrate) navigator.vibrate(10);
            } catch(e) {}
        }

        function generateId() {
            return 'log-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 6);
        }

        function parseDateToMs(val) {
            if (!val) return null;
            if (typeof val === 'number') return val;
            const parsed = Date.parse(val);
            return isNaN(parsed) ? null : parsed;
        }

        const isSameDay = (d1, d2) => d1 && d2 && d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();

        function getDayString(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function isWeekend(d) {
            const day = d.getDay();
            return day === 0 || day === 6; // 0 = Sun, 6 = Sat
        }

        function formatDisplayTime(d) {
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function formatTime12(d) {
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
        }

        function formatDuration(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) {
                return `${h}h ${m}m ${s > 0 ? s + 's' : ''}`.trim();
            }
            if (m > 0) {
                return `${m}m ${s > 0 ? s + 's' : ''}`.trim();
            }
            return `${s}s`;
        }

        function formatDigitalTimer(totalSec) {
            const s = Math.max(0, Math.floor(totalSec));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function padZero(n) {
            return String(n).padStart(2, '0');
        }

        function toTimeInputString(d) {
            return `${padZero(d.getHours())}:${padZero(d.getMinutes())}:${padZero(d.getSeconds())}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Rollover Target Math
        const WORK_START_DATE = '2026-10-05';
        const BASE_WORKDAY_SECONDS = 18000; // 5 hours

        function getLogsArray() {
            if (typeof state !== 'undefined' && state && Array.isArray(state.timeLogs)) {
                return state.timeLogs;
            }
            return [];
        }

        function getDayTrackedSeconds(dayStr) {
            return getLogsArray().filter(l => {
                const ms = parseDateToMs(l.completedAt);
                if (!ms) return false;
                return getDayString(new Date(ms)) === dayStr;
            }).reduce((sum, l) => sum + (l.durationSeconds || 0), 0);
        }

        function getTodayTrackedSeconds() {
            const now = new Date();
            return getLogsArray().filter(l => {
                const ms = parseDateToMs(l.completedAt);
                return ms && isSameDay(new Date(ms), now);
            }).reduce((sum, l) => sum + (l.durationSeconds || 0), 0);
        }

        function calculateDayRolloverDebt() {
            const now = new Date();
            const todayNoon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);

            let runningDebt = 0;
            const cur = new Date(2026, 9, 19, 12, 0, 0); // Monday Oct 19

            while (cur < todayNoon) {
                const dayStr = getDayString(cur);
                const isWe = isWeekend(cur);
                const dayBaseTarget = isWe ? 0 : BASE_WORKDAY_SECONDS;
                const totalTargetForDay = dayBaseTarget + runningDebt;
                const workedOnDay = getDayTrackedSeconds(dayStr);
                runningDebt = Math.max(0, totalTargetForDay - workedOnDay);
                cur.setDate(cur.getDate() + 1);
            }

            return runningDebt;
        }

        function calculateTodayTargetSeconds() {
            const now = new Date();
            const debt = calculateDayRolloverDebt();
            const baseTarget = isWeekend(now) ? 0 : BASE_WORKDAY_SECONDS;
            return baseTarget + debt;
        }

        function calculateDailyRemainingSeconds() {
            const todayTarget = calculateTodayTargetSeconds();
            const todayWorked = getTodayTrackedSeconds();
            let liveElapsed = 0;
            if (typeof state !== 'undefined' && state && state.timerIsRunning && state.currentIntervalStart) {
                const startMs = parseDateToMs(state.currentIntervalStart) || Date.now();
                liveElapsed = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
            }
            return Math.max(0, todayTarget - (todayWorked + liveElapsed));
        }

        // Monday Oct 19 baseline session: worked 4h 16m (leaves 44m)
        const DEFAULT_MONDAY_LOG = {
            id: 'log-20261019-session',
            title: 'Work Session',
            startedAt: new Date(2026, 9, 19, 9, 0, 0).toISOString(),
            completedAt: new Date(2026, 9, 19, 13, 16, 0).toISOString(),
            durationSeconds: 15360,
            type: 'Work'
        };

        const STORAGE_STATE_KEY = 'focuspulse_state_v11';
        const STORAGE_CONFIG_KEY = 'focuspulse_config_v11';

        let config = {
            firebaseUrl: 'https://focuspulse-d6131-default-rtdb.firebaseio.com'
        };

        try {
            const savedCfg = localStorage.getItem(STORAGE_CONFIG_KEY);
            if (savedCfg) config = Object.assign(config, JSON.parse(savedCfg));
        } catch(e) {}

        let state = {
            timerTotalSeconds: 38640,
            timerRemainingSeconds: 38640,
            timerIsRunning: false,
            isTimerSessionActive: false,
            timerTargetEndDate: null,
            currentIntervalStart: null,
            timeLogs: [DEFAULT_MONDAY_LOG],
            todos: [],
            notes: []
        };

        // Load local cache if present
        try {
            const cached = localStorage.getItem(STORAGE_STATE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                state = Object.assign(state, parsed);
            }
        } catch(e) {}

        // Ensure baseline Monday session exists if empty
        if (!Array.isArray(state.timeLogs) || state.timeLogs.length === 0) {
            state.timeLogs = [DEFAULT_MONDAY_LOG];
        }

        state.timerTotalSeconds = calculateTodayTargetSeconds();
        state.timerRemainingSeconds = calculateDailyRemainingSeconds();

        function saveStateLocally() {
            try {
                localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state));
            } catch(e) {}
        }

        // DOM elements
        const dialFill = document.getElementById('dialFill');
        const dialTime = document.getElementById('dialTime');
        const dialStatusLine = document.getElementById('dialStatusLine');
        const dialStatusText = document.getElementById('dialStatusText');
        const btnStart = document.getElementById('btnStart');
        const btnStartText = document.getElementById('btnStartText');
        const btnPause = document.getElementById('btnPause');
        const historyGroup = document.getElementById('historyGroup');
        const cloudStatusDot = document.getElementById('cloudStatusDot');
        const cloudStatusText = document.getElementById('cloudStatusText');

        const DIAL_CIRCUMFERENCE = 753.98; // 2 * PI * 120

        // Render UI
        function renderUI() {
            const todayTarget = calculateTodayTargetSeconds();
            const todayLogged = getTodayTrackedSeconds();

            let liveElapsed = 0;
            if (state.timerIsRunning && state.currentIntervalStart) {
                const sMs = parseDateToMs(state.currentIntervalStart) || Date.now();
                liveElapsed = Math.max(0, Math.floor((Date.now() - sMs) / 1000));
            }

            const totalLoggedWithLive = todayLogged + liveElapsed;
            const remaining = Math.max(0, todayTarget - totalLoggedWithLive);

            // Digital time in Apple Clock font
            dialTime.textContent = formatDigitalTimer(remaining);

            // Progress Ring
            const progress = todayTarget > 0 ? Math.min(1.0, totalLoggedWithLive / todayTarget) : 0;
            const offset = DIAL_CIRCUMFERENCE * (1.0 - progress);
            dialFill.style.strokeDashoffset = offset;

            // Status Bell & End Time
            if (state.timerIsRunning && state.timerTargetEndDate) {
                const endMs = parseDateToMs(state.timerTargetEndDate) || (Date.now() + remaining * 1000);
                dialStatusText.textContent = `🔔 ${formatTime12(new Date(endMs))} (+${formatDuration(liveElapsed)})`;
            } else if (remaining === 0) {
                dialStatusText.textContent = `🎉 Daily Goal Achieved!`;
            } else {
                dialStatusText.textContent = `Goal: ${formatDuration(todayTarget)} · ${formatDuration(totalLoggedWithLive)} logged`;
            }

            // Buttons State
            if (state.timerIsRunning) {
                btnStart.classList.add('running');
                btnStartText.textContent = 'Pause';
                btnStart.onclick = handlePause;

                btnPause.classList.remove('disabled');
                btnPause.onclick = handlePause;
            } else {
                btnStart.classList.remove('running');
                btnStartText.textContent = 'Start';
                btnStart.onclick = handleStart;

                btnPause.classList.add('disabled');
                btnPause.onclick = null;
            }

            renderHistoryList();
        }

        // Render History List in Apple Inset Group
        function renderHistoryList() {
            const logs = getLogsArray();
            if (logs.length === 0) {
                historyGroup.innerHTML = `<div class="empty-row">No sessions logged yet. Tap Start to begin tracking.</div>`;
                return;
            }

            const sorted = [...logs].sort((a, b) => {
                const msA = parseDateToMs(a.completedAt || a.startedAt) || 0;
                const msB = parseDateToMs(b.completedAt || b.startedAt) || 0;
                return msB - msA;
            });

            const groups = {};
            const now = new Date();
            const todayStr = getDayString(now);

            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = getDayString(yesterdayDate);

            sorted.forEach(l => {
                const ms = parseDateToMs(l.completedAt || l.startedAt) || Date.now();
                const d = new Date(ms);
                const dayStr = getDayString(d);
                if (!groups[dayStr]) groups[dayStr] = { date: d, items: [] };
                groups[dayStr].items.push(l);
            });

            let html = '';
            for (const [dayStr, grp] of Object.entries(groups)) {
                let headerTitle = dayStr;
                if (dayStr === todayStr) {
                    headerTitle = `Today · ${grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
                } else if (dayStr === yesterdayStr) {
                    headerTitle = `Yesterday · ${grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
                } else {
                    headerTitle = grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                }

                const dayTotalSec = grp.items.reduce((s, it) => s + (it.durationSeconds || 0), 0);

                html += `
                    <div class="group-date-label">
                        <span>${headerTitle}</span>
                        <span>${formatDuration(dayTotalSec)}</span>
                    </div>
                `;

                grp.items.forEach(log => {
                    const startMs = parseDateToMs(log.startedAt);
                    const endMs = parseDateToMs(log.completedAt);
                    const startStr = startMs ? formatDisplayTime(new Date(startMs)) : '—';
                    const endStr = endMs ? formatDisplayTime(new Date(endMs)) : '—';
                    const durStr = formatDuration(log.durationSeconds || 0);

                    html += `
                        <div class="apple-row" onclick="openEditSessionModal('${log.id}')">
                            <div class="row-icon-squircle">
                                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                            </div>
                            <div class="row-content">
                                <span class="row-title">${escapeHtml(log.title || 'Work Session')}</span>
                                <span class="row-subtitle">${startStr} – ${endStr}</span>
                            </div>
                            <div class="row-right">
                                <span class="row-badge">${durStr}</span>
                                <div class="row-chevron">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            historyGroup.innerHTML = html;
        }

        // START Action
        function handleStart() {
            haptic();
            if (state.timerIsRunning) return;

            const now = new Date();
            state.timerIsRunning = true;
            state.isTimerSessionActive = true;
            state.currentIntervalStart = now.toISOString();

            const remaining = calculateDailyRemainingSeconds();
            state.timerRemainingSeconds = remaining;
            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerTargetEndDate = new Date(now.getTime() + remaining * 1000).toISOString();

            saveStateLocally();
            renderUI();
            pushStateToCloud(false);
        }

        // PAUSE Action
        function handlePause() {
            haptic();
            if (!state.timerIsRunning) return;

            const now = new Date();
            const endMs = now.getTime();
            const startMs = parseDateToMs(state.currentIntervalStart) || (endMs - 1000);
            const durationSec = Math.max(1, Math.round((endMs - startMs) / 1000));

            const newLog = {
                id: generateId(),
                title: 'Focus Session',
                startedAt: new Date(startMs).toISOString(),
                completedAt: new Date(endMs).toISOString(),
                durationSeconds: durationSec,
                type: 'Work'
            };

            state.timeLogs = [newLog, ...(state.timeLogs || [])];
            state.timerIsRunning = false;
            state.isTimerSessionActive = false;
            state.currentIntervalStart = null;
            state.timerTargetEndDate = null;

            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerRemainingSeconds = calculateDailyRemainingSeconds();

            saveStateLocally();
            renderUI();
            pushStateToCloud(true);
        }

        // Ticking loop: 1 second interval
        setInterval(() => {
            if (state.timerIsRunning) {
                state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                renderUI();
            }
        }, 1000);

        // Edit / Add Modal Logic
        const sessionModal = document.getElementById('sessionModal');
        const modalTitle = document.getElementById('modalTitle');
        const editSessionId = document.getElementById('editSessionId');
        const modalSessionTitle = document.getElementById('modalSessionTitle');
        const modalSessionDate = document.getElementById('modalSessionDate');
        const modalStartTime = document.getElementById('modalStartTime');
        const modalEndTime = document.getElementById('modalEndTime');
        const modalDurationPreview = document.getElementById('modalDurationPreview');
        const btnModalDelete = document.getElementById('btnModalDelete');

        function openAddSessionModal() {
            haptic();
            modalTitle.textContent = 'Add Session';
            editSessionId.value = '';
            modalSessionTitle.value = 'Focus Session';

            const now = new Date();
            const oneHourAgo = new Date(now.getTime() - 3600 * 1000);

            modalSessionDate.value = getDayString(now);
            modalStartTime.value = toTimeInputString(oneHourAgo);
            modalEndTime.value = toTimeInputString(now);

            btnModalDelete.style.display = 'none';
            updateModalDuration();

            sessionModal.classList.add('open');
        }

        function openEditSessionModal(id) {
            haptic();
            const log = getLogsArray().find(l => String(l.id) === String(id));
            if (!log) return;

            modalTitle.textContent = 'Edit Session';
            editSessionId.value = log.id;
            modalSessionTitle.value = log.title || 'Focus Session';

            const startMs = parseDateToMs(log.startedAt) || Date.now();
            const endMs = parseDateToMs(log.completedAt) || (startMs + (log.durationSeconds || 0) * 1000);

            const sDate = new Date(startMs);
            const eDate = new Date(endMs);

            modalSessionDate.value = getDayString(sDate);
            modalStartTime.value = toTimeInputString(sDate);
            modalEndTime.value = toTimeInputString(eDate);

            btnModalDelete.style.display = 'block';
            updateModalDuration();

            sessionModal.classList.add('open');
        }

        function closeSessionModal() {
            sessionModal.classList.remove('open');
        }

        function onModalTimeInputChanged() {
            updateModalDuration();
        }

        function getModalDates() {
            const dateStr = modalSessionDate.value;
            const startStr = modalStartTime.value;
            const endStr = modalEndTime.value;

            if (!dateStr || !startStr || !endStr) return null;

            const [y, mo, d] = dateStr.split('-').map(Number);
            const [sh, sm, ss] = startStr.split(':').map(Number);
            const [eh, em, es] = endStr.split(':').map(Number);

            const startDate = new Date(y, mo - 1, d, sh || 0, sm || 0, ss || 0);
            let endDate = new Date(y, mo - 1, d, eh || 0, em || 0, es || 0);

            if (endDate <= startDate) {
                endDate = new Date(endDate.getTime() + 24 * 3600 * 1000);
            }

            return { startDate, endDate };
        }

        function updateModalDuration() {
            const pair = getModalDates();
            if (!pair) {
                modalDurationPreview.textContent = 'Invalid time';
                return;
            }
            const sec = Math.max(0, Math.round((pair.endDate.getTime() - pair.startDate.getTime()) / 1000));
            modalDurationPreview.textContent = formatDuration(sec);
        }

        function adjustModalEndTime(minutes) {
            haptic();
            const endStr = modalEndTime.value || '12:00:00';
            const parts = endStr.split(':').map(Number);
            let totalSec = (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
            totalSec = Math.max(0, totalSec + minutes * 60);

            const h = Math.floor(totalSec / 3600) % 24;
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            modalEndTime.value = `${padZero(h)}:${padZero(m)}:${padZero(s)}`;
            updateModalDuration();
        }

        function saveSessionModal() {
            haptic();
            const pair = getModalDates();
            if (!pair) {
                alert('Please enter valid start and end times.');
                return;
            }

            const id = editSessionId.value;
            const title = modalSessionTitle.value.trim() || 'Focus Session';
            const durationSeconds = Math.max(1, Math.round((pair.endDate.getTime() - pair.startDate.getTime()) / 1000));
            const startedAt = pair.startDate.toISOString();
            const completedAt = pair.endDate.toISOString();

            if (id) {
                state.timeLogs = getLogsArray().map(l => {
                    if (String(l.id) === String(id)) {
                        return Object.assign({}, l, {
                            title,
                            startedAt,
                            completedAt,
                            durationSeconds,
                            type: l.type || 'Work'
                        });
                    }
                    return l;
                });
            } else {
                const newLog = {
                    id: generateId(),
                    title,
                    startedAt,
                    completedAt,
                    durationSeconds,
                    type: 'Work'
                };
                state.timeLogs = [newLog, ...(state.timeLogs || [])];
            }

            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerRemainingSeconds = calculateDailyRemainingSeconds();

            saveStateLocally();
            renderUI();
            pushStateToCloud(true);
            closeSessionModal();
        }

        function deleteSessionFromModal() {
            haptic();
            const id = editSessionId.value;
            if (!id) return;
            if (confirm('Delete this session?')) {
                state.timeLogs = getLogsArray().filter(l => String(l.id) !== String(id));
                state.timerTotalSeconds = calculateTodayTargetSeconds();
                state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                saveStateLocally();
                renderUI();
                pushStateToCloud(true);
                closeSessionModal();
            }
        }

        // Settings Modal
        const settingsModal = document.getElementById('settingsModal');
        const inputFirebaseUrl = document.getElementById('inputFirebaseUrl');

        function toggleSettingsModal() {
            haptic();
            if (settingsModal.classList.contains('open')) {
                settingsModal.classList.remove('open');
            } else {
                inputFirebaseUrl.value = config.firebaseUrl;
                settingsModal.classList.add('open');
            }
        }

        function saveFirebaseSettings() {
            haptic();
            const url = inputFirebaseUrl.value.trim();
            if (!url) return;
            config.firebaseUrl = url;
            try {
                localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(config));
            } catch(e) {}
            settingsModal.classList.remove('open');
            initCloudSync();
        }

        // Cloud Synchronization (Firebase Realtime Database)
        let sseSource = null;
        let pollTimer = null;
        let pushDebounce = null;

        function setStatus(status, text) {
            cloudStatusDot.className = 'cloud-dot ' + status;
            cloudStatusText.textContent = text;
        }

        function getCleanFirebaseUrl() {
            let u = (config.firebaseUrl || '').trim();
            if (u.endsWith('/')) u = u.slice(0, -1);
            if (u.endsWith('.json')) u = u.slice(0, -5);
            return u;
        }

        function pushStateToCloud(immediate = false) {
            if (pushDebounce) clearTimeout(pushDebounce);

            const doPush = async () => {
                const base = getCleanFirebaseUrl();
                if (!base) return;

                setStatus('syncing', 'Syncing...');

                const payload = {
                    timerTotalSeconds: calculateTodayTargetSeconds(),
                    timerRemainingSeconds: calculateDailyRemainingSeconds(),
                    timerIsRunning: !!state.timerIsRunning,
                    isTimerSessionActive: !!state.isTimerSessionActive,
                    timerTargetEndDate: state.timerTargetEndDate,
                    currentIntervalStart: state.currentIntervalStart,
                    timeLogs: state.timeLogs || [],
                    completedPomodorosToday: 1,
                    showDesktopWidget: true,
                    desktopWidgetSize: 'large',
                    currentTrackingTitle: '',
                    stopwatchIsRunning: false,
                    stopwatchAccumulatedTime: 0,
                    todos: state.todos || [],
                    notes: state.notes || []
                };

                try {
                    const resp = await fetch(`${base}/state.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        setStatus('online', 'Synced');
                    } else {
                        setStatus('offline', 'Sync Error');
                    }
                } catch(e) {
                    setStatus('offline', 'Offline');
                }
            };

            if (immediate) {
                doPush();
            } else {
                pushDebounce = setTimeout(doPush, 400);
            }
        }

        async function fetchInitialCloudState() {
            const base = getCleanFirebaseUrl();
            if (!base) return;

            setStatus('syncing', 'Connecting...');
            try {
                const resp = await fetch(`${base}/state.json`);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && typeof data === 'object') {
                        // Merge without wiping
                        if (Array.isArray(data.timeLogs) && data.timeLogs.length > 0) {
                            state.timeLogs = data.timeLogs;
                        }
                        if (typeof data.timerIsRunning === 'boolean') {
                            state.timerIsRunning = data.timerIsRunning;
                        }
                        if (data.currentIntervalStart) {
                            state.currentIntervalStart = data.currentIntervalStart;
                        }
                        if (data.timerTargetEndDate) {
                            state.timerTargetEndDate = data.timerTargetEndDate;
                        }

                        state.timerTotalSeconds = calculateTodayTargetSeconds();
                        state.timerRemainingSeconds = calculateDailyRemainingSeconds();

                        saveStateLocally();
                        renderUI();
                        setStatus('online', 'Synced');
                        return;
                    }
                }
                setStatus('online', 'Ready');
            } catch(e) {
                setStatus('offline', 'Offline');
            }
        }

        function initCloudSync() {
            if (sseSource) {
                sseSource.close();
                sseSource = null;
            }
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            fetchInitialCloudState();

            const base = getCleanFirebaseUrl();
            if (!base) return;

            try {
                sseSource = new EventSource(`${base}/state.json`);
                sseSource.addEventListener('put', (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        if (parsed && parsed.data) {
                            const d = parsed.data;
                            if (Array.isArray(d.timeLogs) && d.timeLogs.length > 0) {
                                state.timeLogs = d.timeLogs;
                            }
                            if (typeof d.timerIsRunning === 'boolean') {
                                state.timerIsRunning = d.timerIsRunning;
                            }
                            if (d.currentIntervalStart) {
                                state.currentIntervalStart = d.currentIntervalStart;
                            }
                            if (d.timerTargetEndDate) {
                                state.timerTargetEndDate = d.timerTargetEndDate;
                            }
                            state.timerTotalSeconds = calculateTodayTargetSeconds();
                            state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                            saveStateLocally();
                            renderUI();
                            setStatus('online', 'Synced');
                        }
                    } catch(err) {}
                });
                sseSource.onerror = () => {
                    setStatus('offline', 'Reconnecting');
                };
            } catch(e) {}
        }

        // Boot
        renderUI();
        initCloudSync();
    </script>
</body>
</html>
