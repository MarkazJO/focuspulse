<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FocusPulse">
    <meta name="theme-color" content="#000000">
    <title>FocusPulse</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.75);
            --surface-card: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --surface-input: #3a3a3c;
            --accent-orange: #ff9f0a;
            --accent-green: #34c759;
            --accent-red: #ff453a;
            --accent-blue: #0a84ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 159, 10, 0.5);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, button {
            user-select: auto;
            -webkit-user-select: auto;
            font-family: inherit;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-top: var(--safe-top);
            padding-bottom: calc(var(--safe-bottom) + 16px);
        }

        /* Top Header */
        header {
            padding: 12px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff9f0a, #ff6b00);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            box-shadow: 0 2px 8px rgba(255, 159, 10, 0.4);
        }

        .brand-icon svg {
            width: 16px;
            height: 16px;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8e8e93;
        }

        .status-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(52, 199, 89, 0.6);
        }

        .status-dot.syncing {
            background: var(--accent-orange);
            box-shadow: 0 0 6px rgba(255, 159, 10, 0.6);
            animation: pulse 1s infinite;
        }

        .status-dot.offline {
            background: var(--accent-red);
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(0.96);
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Main Content Container */
        main {
            flex: 1;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        /* Hero Card: Remaining Time */
        .hero-card {
            background: var(--surface-color);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px 18px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .badge-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            background: rgba(255, 159, 10, 0.12);
            border: 1px solid rgba(255, 159, 10, 0.25);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--accent-orange);
            margin-bottom: 16px;
        }

        /* Countdown display */
        .countdown-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 78px;
        }

        .time-value {
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            color: var(--text-primary);
        }

        .time-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
        }

        .time-colon {
            font-size: 38px;
            font-weight: 600;
            color: var(--text-tertiary);
            line-height: 1;
            margin-bottom: 20px;
            user-select: none;
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin: 12px 0 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9f0a, #34c759);
            width: 0%;
            border-radius: var(--radius-full);
            transition: width 0.4s ease;
        }

        /* Stats Strip */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .stat-val {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        /* Live Tracking Banner */
        .live-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(52, 199, 89, 0.12);
            border: 1px solid rgba(52, 199, 89, 0.3);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-green);
        }

        .live-banner.active {
            display: flex;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(52, 199, 89, 0.8);
            animation: pulse 1.2s infinite ease-in-out;
        }

        /* Action Buttons: START and PAUSE */
        .controls-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            height: 64px;
            border-radius: var(--radius-md);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-start {
            background: #34c759;
            color: #000000;
            box-shadow: 0 4px 16px rgba(52, 199, 89, 0.35);
        }

        .btn-start.running {
            background: #1c3822;
            color: #34c759;
            border: 1px solid rgba(52, 199, 89, 0.4);
            box-shadow: none;
        }

        .btn-pause {
            background: #ff9f0a;
            color: #000000;
            box-shadow: 0 4px 16px rgba(255, 159, 10, 0.35);
        }

        .btn-pause.disabled {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-tertiary);
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-action svg {
            width: 22px;
            height: 22px;
        }

        /* History Log Section */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .btn-add-session {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            color: var(--accent-orange);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add-session:active {
            background: rgba(255, 255, 255, 0.16);
            transform: scale(0.96);
        }

        .btn-add-session svg {
            width: 14px;
            height: 14px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .date-group-header {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 8px 6px 2px;
            display: flex;
            justify-content: space-between;
        }

        /* Log Entry Card */
        .log-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: background 0.15s;
        }

        .log-card:active {
            background: rgba(44, 44, 46, 0.8);
        }

        .log-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .log-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-times {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .log-times svg {
            width: 13px;
            height: 13px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .log-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .duration-badge {
            padding: 4px 9px;
            border-radius: var(--radius-full);
            background: rgba(255, 159, 10, 0.12);
            color: var(--accent-orange);
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            border: 1px solid rgba(255, 159, 10, 0.2);
        }

        .icon-btn-edit {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn-edit:active {
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            transform: scale(0.94);
        }

        .icon-btn-edit svg {
            width: 15px;
            height: 15px;
        }

        .empty-history {
            text-align: center;
            padding: 28px 16px;
            background: var(--surface-card);
            border: 1px dashed var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* Modal Overlay & Sheet */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-sheet {
            background: #1c1c1e;
            border: 1px solid var(--border-subtle);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 520px;
            padding: 20px 20px calc(var(--safe-bottom) + 20px);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.6);
            transform: translateY(100%);
            transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 0 14px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-orange);
        }

        .time-inputs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Quick Adjustment Steppers ("Go back in time") */
        .adjust-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .adjust-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .adjust-chip:active {
            background: var(--accent-orange);
            color: #000;
            transform: scale(0.95);
        }

        .duration-preview-card {
            background: rgba(255, 159, 10, 0.08);
            border: 1px dashed rgba(255, 159, 10, 0.3);
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 16px 0 20px;
        }

        .duration-preview-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .duration-preview-val {
            font-size: 17px;
            font-weight: 700;
            color: var(--accent-orange);
            font-variant-numeric: tabular-nums;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-modal-save {
            height: 50px;
            background: var(--accent-orange);
            color: #000;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-modal-save:active {
            opacity: 0.85;
        }

        .btn-modal-delete {
            height: 44px;
            background: transparent;
            color: var(--accent-red);
            border: 1px solid rgba(255, 69, 58, 0.3);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }
    </style>
</head>
<body>
    <!-- Top Header -->
    <header>
        <div class="brand-container">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm1 14h-2V8h2v8zm-1-10c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"/></svg>
            </div>
            <span class="brand-title">FocusPulse</span>
        </div>

        <div class="header-actions">
            <div class="status-pill" id="cloudStatusBadge" onclick="toggleSettingsModal()">
                <div class="status-dot" id="cloudStatusDot"></div>
                <span id="cloudStatusText">Syncing...</span>
            </div>
            <button class="icon-btn" onclick="toggleSettingsModal()" title="Settings">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main View -->
    <main>
        <!-- Hero: Remaining Time -->
        <section class="hero-card">
            <div class="badge-header">Remaining Today</div>

            <div class="countdown-container">
                <div class="time-box">
                    <span class="time-value" id="dispHours">08</span>
                    <span class="time-label">HOURS</span>
                </div>
                <div class="time-colon">:</div>
                <div class="time-box">
                    <span class="time-value" id="dispMins">28</span>
                    <span class="time-label">MINUTES</span>
                </div>
                <div class="time-colon">:</div>
                <div class="time-box">
                    <span class="time-value" id="dispSecs">00</span>
                    <span class="time-label">SECONDS</span>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Target</span>
                    <span class="stat-val" id="statTarget">8h 28m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Logged</span>
                    <span class="stat-val" id="statLogged">0h 00m</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed</span>
                    <span class="stat-val" id="statPct">0%</span>
                </div>
            </div>
        </section>

        <!-- Live Session Status Banner -->
        <div class="live-banner" id="liveBanner">
            <div class="live-dot"></div>
            <span id="liveBannerText">Session in progress (00:00:00)</span>
        </div>

        <!-- The Two Main Buttons: START and PAUSE -->
        <section class="controls-container">
            <button class="btn-action btn-start" id="btnStart" onclick="handleStart()">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                <span id="btnStartText">Start</span>
            </button>
            <button class="btn-action btn-pause disabled" id="btnPause" onclick="handlePause()">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span>Pause</span>
            </button>
        </section>

        <!-- History Log Section -->
        <section class="history-section">
            <div class="section-header">
                <div>
                    <h2 class="section-title">History Log</h2>
                </div>
                <button class="btn-add-session" onclick="openAddSessionModal()">
                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Add Session</span>
                </button>
            </div>

            <div class="history-list" id="historyList">
                <!-- Dynamically populated -->
            </div>
        </section>
    </main>

    <!-- Session Edit / Add Modal -->
    <div class="modal-overlay" id="sessionModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Edit Session</h3>
                <button class="modal-close" onclick="closeSessionModal()">✕</button>
            </div>

            <input type="hidden" id="editSessionId">

            <div class="form-group">
                <label class="form-label">Session Title</label>
                <input type="text" class="form-input" id="modalSessionTitle" placeholder="Work Session">
            </div>

            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" class="form-input" id="modalSessionDate">
            </div>

            <div class="time-inputs-row">
                <div class="form-group">
                    <label class="form-label">Start Time</label>
                    <input type="time" step="1" class="form-input" id="modalStartTime" onchange="onModalTimeInputChanged()">
                </div>
                <div class="form-group">
                    <label class="form-label">End Time</label>
                    <input type="time" step="1" class="form-input" id="modalEndTime" onchange="onModalTimeInputChanged()">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Quick Adjust End Time ("Go back in time")</label>
                <div class="adjust-chips">
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(-15)">-15m</button>
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(-5)">-5m</button>
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(-1)">-1m</button>
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(1)">+1m</button>
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(5)">+5m</button>
                    <button type="button" class="adjust-chip" onclick="adjustModalEndTime(15)">+15m</button>
                </div>
            </div>

            <div class="duration-preview-card">
                <span class="duration-preview-label">Calculated Duration</span>
                <span class="duration-preview-val" id="modalDurationPreview">0h 00m 00s</span>
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-save" onclick="saveSessionModal()">Save Changes</button>
                <button class="btn-modal-delete" id="btnModalDelete" onclick="deleteSessionFromModal()">Delete Session</button>
            </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3 class="modal-title">Cloud Settings</h3>
                <button class="modal-close" onclick="toggleSettingsModal()">✕</button>
            </div>

            <div class="form-group">
                <label class="form-label">Firebase Database URL</label>
                <input type="text" class="form-input" id="inputFirebaseUrl" placeholder="https://your-app.firebaseio.com">
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-save" onclick="saveFirebaseSettings()">Save & Reconnect</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Register ServiceWorker with automatic cache-busting & updates
        if ('serviceWorker' in navigator) {
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=9').then(reg => {
                    reg.update();
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                if (!refreshing) {
                                    refreshing = true;
                                    window.location.reload();
                                }
                            }
                        });
                    });
                }).catch(() => {});
            });
        }

        // Utilities
        function haptic() {
            try {
                if (navigator.vibrate) navigator.vibrate(10);
            } catch(e) {}
        }

        function generateId() {
            return 'log-' + Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 6);
        }

        function parseDateToMs(val) {
            if (!val) return null;
            if (typeof val === 'number') return val;
            const parsed = Date.parse(val);
            return isNaN(parsed) ? null : parsed;
        }

        const isSameDay = (d1, d2) => d1 && d2 && d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();

        function getDayString(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function isWeekend(d) {
            const day = d.getDay();
            return day === 0 || day === 6; // 0 = Sunday, 6 = Saturday (no work on sat & sun)
        }

        function formatDisplayTime(d) {
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
        }

        function formatDuration(sec) {
            sec = Math.max(0, Math.floor(sec));
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) {
                return `${h}h ${m}m ${s > 0 ? s + 's' : ''}`.trim();
            }
            if (m > 0) {
                return `${m}m ${s > 0 ? s + 's' : ''}`.trim();
            }
            return `${s}s`;
        }

        function formatRemainingHMS(totalSec) {
            const s = Math.max(0, Math.floor(totalSec));
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return {
                h: String(h).padStart(2, '0'),
                m: String(m).padStart(2, '0'),
                s: String(sec).padStart(2, '0')
            };
        }

        function padZero(n) {
            return String(n).padStart(2, '0');
        }

        function toTimeInputString(d) {
            return `${padZero(d.getHours())}:${padZero(d.getMinutes())}:${padZero(d.getSeconds())}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Rollover Target & Remaining Math
        const WORK_START_DATE = '2026-10-05';
        const BASE_WORKDAY_SECONDS = 18000; // 5 hours daily (Mon-Fri)

        function getLogsArray() {
            if (typeof state !== 'undefined' && state && Array.isArray(state.timeLogs)) {
                return state.timeLogs;
            }
            return [];
        }

        function getDayTrackedSeconds(dayStr) {
            return getLogsArray().filter(l => {
                const ms = parseDateToMs(l.completedAt);
                if (!ms) return false;
                return getDayString(new Date(ms)) === dayStr;
            }).reduce((sum, l) => sum + (l.durationSeconds || 0), 0);
        }

        function getTodayTrackedSeconds() {
            const now = new Date();
            return getLogsArray().filter(l => {
                const ms = parseDateToMs(l.completedAt);
                return ms && isSameDay(new Date(ms), now);
            }).reduce((sum, l) => sum + (l.durationSeconds || 0), 0);
        }

        function calculateDayRolloverDebt() {
            const now = new Date();
            const yesterday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
            const yesterdayStr = getDayString(yesterday);

            // Baseline remaining debt from yesterday: 3h 28m = 12,480s
            // User requested: "from yesterday i have 3h 28min left"
            let debt = 3 * 3600 + 28 * 60;

            const yesterdayLogs = getLogsArray().filter(l => {
                const ms = parseDateToMs(l.completedAt);
                if (!ms) return false;
                const dStr = getDayString(new Date(ms));
                return dStr === yesterdayStr || dStr === '2026-10-19' || dStr === '2026-10-20';
            });

            if (yesterdayLogs.length > 0) {
                const workedSec = yesterdayLogs.reduce((sum, l) => sum + (l.durationSeconds || 0), 0);
                debt = Math.max(0, BASE_WORKDAY_SECONDS - workedSec);
            }

            return debt;
        }

        function calculateTodayTargetSeconds() {
            const now = new Date();
            const debt = calculateDayRolloverDebt();
            const baseTarget = isWeekend(now) ? 0 : BASE_WORKDAY_SECONDS;
            return baseTarget + debt;
        }

        function calculateDailyRemainingSeconds() {
            const todayTarget = calculateTodayTargetSeconds();
            const todayWorked = getTodayTrackedSeconds();
            let liveElapsed = 0;
            if (typeof state !== 'undefined' && state && state.timerIsRunning && state.currentIntervalStart) {
                const startMs = parseDateToMs(state.currentIntervalStart) || Date.now();
                liveElapsed = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
            }
            return Math.max(0, todayTarget - (todayWorked + liveElapsed));
        }

        // Baseline session for Oct 19 leaving 3h 28m of 5h: 1h 32m worked
        const DEFAULT_YESTERDAY_LOG = {
            id: 'log-20261019-session',
            title: 'Work Session',
            startedAt: new Date(2026, 9, 19, 9, 0, 0).toISOString(),
            completedAt: new Date(2026, 9, 19, 10, 32, 0).toISOString(),
            durationSeconds: 5520, // 1h 32m -> leaves 3h 28m
            type: 'Work'
        };

        // Application State
        const STORAGE_STATE_KEY = 'focuspulse_state_v9';
        const STORAGE_CONFIG_KEY = 'focuspulse_config_v9';

        let config = {
            firebaseUrl: 'https://focuspulse-d6131-default-rtdb.firebaseio.com'
        };

        try {
            const savedCfg = localStorage.getItem(STORAGE_CONFIG_KEY);
            if (savedCfg) config = Object.assign(config, JSON.parse(savedCfg));
        } catch(e) {}

        let state = {
            timerTotalSeconds: 30480,
            timerRemainingSeconds: 30480,
            timerIsRunning: false,
            isTimerSessionActive: false,
            timerTargetEndDate: null,
            currentIntervalStart: null,
            timeLogs: [DEFAULT_YESTERDAY_LOG],
            todos: [],
            notes: []
        };

        // Load local state cache
        try {
            const cached = localStorage.getItem(STORAGE_STATE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                state = Object.assign(state, parsed);
            }
        } catch(e) {}

        // Ensure baseline Oct 19 log exists if logs empty
        if (!Array.isArray(state.timeLogs) || state.timeLogs.length === 0) {
            state.timeLogs = [DEFAULT_YESTERDAY_LOG];
        }

        state.timerTotalSeconds = calculateTodayTargetSeconds();
        state.timerRemainingSeconds = calculateDailyRemainingSeconds();

        function saveStateLocally() {
            try {
                localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state));
            } catch(e) {}
        }

        // UI Elements
        const dispHours = document.getElementById('dispHours');
        const dispMins = document.getElementById('dispMins');
        const dispSecs = document.getElementById('dispSecs');
        const progressFill = document.getElementById('progressFill');
        const statTarget = document.getElementById('statTarget');
        const statLogged = document.getElementById('statLogged');
        const statPct = document.getElementById('statPct');
        const liveBanner = document.getElementById('liveBanner');
        const liveBannerText = document.getElementById('liveBannerText');
        const btnStart = document.getElementById('btnStart');
        const btnStartText = document.getElementById('btnStartText');
        const btnPause = document.getElementById('btnPause');
        const historyList = document.getElementById('historyList');
        const cloudStatusDot = document.getElementById('cloudStatusDot');
        const cloudStatusText = document.getElementById('cloudStatusText');

        // Render UI
        function renderUI() {
            const todayTarget = calculateTodayTargetSeconds();
            const todayLogged = getTodayTrackedSeconds();

            let liveElapsed = 0;
            if (state.timerIsRunning && state.currentIntervalStart) {
                const sMs = parseDateToMs(state.currentIntervalStart) || Date.now();
                liveElapsed = Math.max(0, Math.floor((Date.now() - sMs) / 1000));
            }

            const totalLoggedWithLive = todayLogged + liveElapsed;
            const remaining = Math.max(0, todayTarget - totalLoggedWithLive);

            // Update remaining time digits
            const hms = formatRemainingHMS(remaining);
            dispHours.textContent = hms.h;
            dispMins.textContent = hms.m;
            dispSecs.textContent = hms.s;

            // Stats
            statTarget.textContent = formatDuration(todayTarget);
            statLogged.textContent = formatDuration(totalLoggedWithLive);
            const pct = todayTarget > 0 ? Math.min(100, Math.round((totalLoggedWithLive / todayTarget) * 100)) : 100;
            statPct.textContent = `${pct}%`;
            progressFill.style.width = `${pct}%`;

            // Live banner & buttons state
            if (state.timerIsRunning) {
                liveBanner.classList.add('active');
                liveBannerText.textContent = `Tracking Active • ${formatDuration(liveElapsed)} elapsed`;

                btnStart.classList.add('running');
                btnStartText.textContent = 'Tracking...';

                btnPause.classList.remove('disabled');
            } else {
                liveBanner.classList.remove('active');

                btnStart.classList.remove('running');
                btnStartText.textContent = 'Start';

                btnPause.classList.add('disabled');
            }

            renderHistoryList();
        }

        // Render History List
        function renderHistoryList() {
            const logs = getLogsArray();
            if (logs.length === 0) {
                historyList.innerHTML = `<div class="empty-history">No sessions logged yet. Tap Start to track a session.</div>`;
                return;
            }

            // Sort newest first
            const sorted = [...logs].sort((a, b) => {
                const msA = parseDateToMs(a.completedAt || a.startedAt) || 0;
                const msB = parseDateToMs(b.completedAt || b.startedAt) || 0;
                return msB - msA;
            });

            // Group by day string
            const groups = {};
            const now = new Date();
            const todayStr = getDayString(now);

            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = getDayString(yesterdayDate);

            sorted.forEach(l => {
                const ms = parseDateToMs(l.completedAt || l.startedAt) || Date.now();
                const d = new Date(ms);
                const dayStr = getDayString(d);
                if (!groups[dayStr]) groups[dayStr] = { date: d, items: [] };
                groups[dayStr].items.push(l);
            });

            let html = '';
            for (const [dayStr, grp] of Object.entries(groups)) {
                let headerTitle = dayStr;
                if (dayStr === todayStr) {
                    headerTitle = `Today • ${grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
                } else if (dayStr === yesterdayStr) {
                    headerTitle = `Yesterday • ${grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}`;
                } else {
                    headerTitle = grp.date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                }

                const dayTotalSec = grp.items.reduce((s, it) => s + (it.durationSeconds || 0), 0);

                html += `
                    <div class="date-group-header">
                        <span>${headerTitle}</span>
                        <span>${formatDuration(dayTotalSec)}</span>
                    </div>
                `;

                grp.items.forEach(log => {
                    const startMs = parseDateToMs(log.startedAt);
                    const endMs = parseDateToMs(log.completedAt);
                    const startStr = startMs ? formatDisplayTime(new Date(startMs)) : '—';
                    const endStr = endMs ? formatDisplayTime(new Date(endMs)) : '—';
                    const durStr = formatDuration(log.durationSeconds || 0);

                    html += `
                        <div class="log-card">
                            <div class="log-info" onclick="openEditSessionModal('${log.id}')">
                                <span class="log-title">${escapeHtml(log.title || 'Work Session')}</span>
                                <div class="log-times">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
                                    <span>${startStr} &rarr; ${endStr}</span>
                                </div>
                            </div>
                            <div class="log-actions">
                                <span class="duration-badge">${durStr}</span>
                                <button class="icon-btn-edit" onclick="openEditSessionModal('${log.id}')" title="Edit Session">
                                    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            historyList.innerHTML = html;
        }

        // START Button Action
        function handleStart() {
            haptic();
            if (state.timerIsRunning) {
                return; // Already running
            }

            const now = new Date();
            state.timerIsRunning = true;
            state.isTimerSessionActive = true;
            state.currentIntervalStart = now.toISOString();

            const remaining = calculateDailyRemainingSeconds();
            state.timerRemainingSeconds = remaining;
            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerTargetEndDate = new Date(now.getTime() + remaining * 1000).toISOString();

            saveStateLocally();
            renderUI();
            pushStateToCloud(false);
        }

        // PAUSE Button Action
        function handlePause() {
            haptic();
            if (!state.timerIsRunning) return;

            const now = new Date();
            const endMs = now.getTime();
            const startMs = parseDateToMs(state.currentIntervalStart) || (endMs - 1000);
            const durationSec = Math.max(1, Math.round((endMs - startMs) / 1000));

            const newLog = {
                id: generateId(),
                title: 'Focus Session',
                startedAt: new Date(startMs).toISOString(),
                completedAt: new Date(endMs).toISOString(),
                durationSeconds: durationSec,
                type: 'Work'
            };

            state.timeLogs = [newLog, ...(state.timeLogs || [])];
            state.timerIsRunning = false;
            state.isTimerSessionActive = false;
            state.currentIntervalStart = null;
            state.timerTargetEndDate = null;

            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerRemainingSeconds = calculateDailyRemainingSeconds();

            saveStateLocally();
            renderUI();
            pushStateToCloud(true);
        }

        // Ticking loop: 1 second interval for smooth timer
        setInterval(() => {
            if (state.timerIsRunning) {
                state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                renderUI();
            }
        }, 1000);

        // Edit / Add Modal Logic
        const sessionModal = document.getElementById('sessionModal');
        const modalTitle = document.getElementById('modalTitle');
        const editSessionId = document.getElementById('editSessionId');
        const modalSessionTitle = document.getElementById('modalSessionTitle');
        const modalSessionDate = document.getElementById('modalSessionDate');
        const modalStartTime = document.getElementById('modalStartTime');
        const modalEndTime = document.getElementById('modalEndTime');
        const modalDurationPreview = document.getElementById('modalDurationPreview');
        const btnModalDelete = document.getElementById('btnModalDelete');

        function openAddSessionModal() {
            haptic();
            modalTitle.textContent = 'Add Session';
            editSessionId.value = '';
            modalSessionTitle.value = 'Focus Session';

            const now = new Date();
            const oneHourAgo = new Date(now.getTime() - 3600 * 1000);

            modalSessionDate.value = getDayString(now);
            modalStartTime.value = toTimeInputString(oneHourAgo);
            modalEndTime.value = toTimeInputString(now);

            btnModalDelete.style.display = 'none';
            updateModalDuration();

            sessionModal.classList.add('open');
        }

        function openEditSessionModal(id) {
            haptic();
            const log = getLogsArray().find(l => String(l.id) === String(id));
            if (!log) return;

            modalTitle.textContent = 'Edit Session';
            editSessionId.value = log.id;
            modalSessionTitle.value = log.title || 'Focus Session';

            const startMs = parseDateToMs(log.startedAt) || Date.now();
            const endMs = parseDateToMs(log.completedAt) || (startMs + (log.durationSeconds || 0) * 1000);

            const sDate = new Date(startMs);
            const eDate = new Date(endMs);

            modalSessionDate.value = getDayString(sDate);
            modalStartTime.value = toTimeInputString(sDate);
            modalEndTime.value = toTimeInputString(eDate);

            btnModalDelete.style.display = 'block';
            updateModalDuration();

            sessionModal.classList.add('open');
        }

        function closeSessionModal() {
            sessionModal.classList.remove('open');
        }

        function onModalTimeInputChanged() {
            updateModalDuration();
        }

        function getModalDates() {
            const dateStr = modalSessionDate.value;
            const startStr = modalStartTime.value;
            const endStr = modalEndTime.value;

            if (!dateStr || !startStr || !endStr) return null;

            const [y, mo, d] = dateStr.split('-').map(Number);
            const [sh, sm, ss] = startStr.split(':').map(Number);
            const [eh, em, es] = endStr.split(':').map(Number);

            const startDate = new Date(y, mo - 1, d, sh || 0, sm || 0, ss || 0);
            let endDate = new Date(y, mo - 1, d, eh || 0, em || 0, es || 0);

            if (endDate <= startDate) {
                // If end is before or equal to start, assume it rolls into next day
                endDate = new Date(endDate.getTime() + 24 * 3600 * 1000);
            }

            return { startDate, endDate };
        }

        function updateModalDuration() {
            const pair = getModalDates();
            if (!pair) {
                modalDurationPreview.textContent = 'Invalid time';
                return;
            }
            const sec = Math.max(0, Math.round((pair.endDate.getTime() - pair.startDate.getTime()) / 1000));
            modalDurationPreview.textContent = formatDuration(sec);
        }

        function adjustModalEndTime(minutes) {
            haptic();
            const endStr = modalEndTime.value || '12:00:00';
            const parts = endStr.split(':').map(Number);
            let totalSec = (parts[0] || 0) * 3600 + (parts[1] || 0) * 60 + (parts[2] || 0);
            totalSec = Math.max(0, totalSec + minutes * 60);

            const h = Math.floor(totalSec / 3600) % 24;
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            modalEndTime.value = `${padZero(h)}:${padZero(m)}:${padZero(s)}`;
            updateModalDuration();
        }

        function saveSessionModal() {
            haptic();
            const pair = getModalDates();
            if (!pair) {
                alert('Please enter valid start and end times.');
                return;
            }

            const id = editSessionId.value;
            const title = modalSessionTitle.value.trim() || 'Focus Session';
            const durationSeconds = Math.max(1, Math.round((pair.endDate.getTime() - pair.startDate.getTime()) / 1000));
            const startedAt = pair.startDate.toISOString();
            const completedAt = pair.endDate.toISOString();

            if (id) {
                // Edit existing
                state.timeLogs = getLogsArray().map(l => {
                    if (String(l.id) === String(id)) {
                        return Object.assign({}, l, {
                            title,
                            startedAt,
                            completedAt,
                            durationSeconds,
                            type: l.type || 'Work'
                        });
                    }
                    return l;
                });
            } else {
                // Add new
                const newLog = {
                    id: generateId(),
                    title,
                    startedAt,
                    completedAt,
                    durationSeconds,
                    type: 'Work'
                };
                state.timeLogs = [newLog, ...(state.timeLogs || [])];
            }

            state.timerTotalSeconds = calculateTodayTargetSeconds();
            state.timerRemainingSeconds = calculateDailyRemainingSeconds();

            saveStateLocally();
            renderUI();
            pushStateToCloud(true);
            closeSessionModal();
        }

        function deleteSessionFromModal() {
            haptic();
            const id = editSessionId.value;
            if (!id) return;
            if (confirm('Delete this session entry?')) {
                state.timeLogs = getLogsArray().filter(l => String(l.id) !== String(id));
                state.timerTotalSeconds = calculateTodayTargetSeconds();
                state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                saveStateLocally();
                renderUI();
                pushStateToCloud(true);
                closeSessionModal();
            }
        }

        // Settings Modal
        const settingsModal = document.getElementById('settingsModal');
        const inputFirebaseUrl = document.getElementById('inputFirebaseUrl');

        function toggleSettingsModal() {
            haptic();
            if (settingsModal.classList.contains('open')) {
                settingsModal.classList.remove('open');
            } else {
                inputFirebaseUrl.value = config.firebaseUrl;
                settingsModal.classList.add('open');
            }
        }

        function saveFirebaseSettings() {
            haptic();
            const url = inputFirebaseUrl.value.trim();
            if (!url) return;
            config.firebaseUrl = url;
            try {
                localStorage.setItem(STORAGE_CONFIG_KEY, JSON.stringify(config));
            } catch(e) {}
            settingsModal.classList.remove('open');
            initCloudSync();
        }

        // Cloud Synchronization (Firebase Realtime Database)
        let sseSource = null;
        let pollTimer = null;
        let pushDebounce = null;
        let isSyncing = false;

        function setStatus(status, text) {
            cloudStatusDot.className = 'status-dot ' + status;
            cloudStatusText.textContent = text;
        }

        function getCleanFirebaseUrl() {
            let u = (config.firebaseUrl || '').trim();
            if (u.endsWith('/')) u = u.slice(0, -1);
            if (u.endsWith('.json')) u = u.slice(0, -5);
            return u;
        }

        function pushStateToCloud(immediate = false) {
            if (pushDebounce) clearTimeout(pushDebounce);

            const doPush = async () => {
                const base = getCleanFirebaseUrl();
                if (!base) return;

                setStatus('syncing', 'Syncing...');

                const payload = {
                    timerTotalSeconds: calculateTodayTargetSeconds(),
                    timerRemainingSeconds: calculateDailyRemainingSeconds(),
                    timerIsRunning: !!state.timerIsRunning,
                    isTimerSessionActive: !!state.isTimerSessionActive,
                    timerTargetEndDate: state.timerTargetEndDate,
                    currentIntervalStart: state.currentIntervalStart,
                    timeLogs: state.timeLogs || [],
                    completedPomodorosToday: 1,
                    showDesktopWidget: true,
                    desktopWidgetSize: 'large',
                    currentTrackingTitle: '',
                    stopwatchIsRunning: false,
                    stopwatchAccumulatedTime: 0,
                    todos: state.todos || [],
                    notes: state.notes || []
                };

                try {
                    const resp = await fetch(`${base}/state.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        setStatus('online', 'Synced');
                    } else {
                        setStatus('offline', 'Sync Error');
                    }
                } catch(e) {
                    setStatus('offline', 'Offline');
                }
            };

            if (immediate) {
                doPush();
            } else {
                pushDebounce = setTimeout(doPush, 400);
            }
        }

        async function fetchInitialCloudState() {
            const base = getCleanFirebaseUrl();
            if (!base) return;

            setStatus('syncing', 'Connecting...');
            try {
                const resp = await fetch(`${base}/state.json`);
                if (resp.ok) {
                    const data = await resp.json();
                    if (data && typeof data === 'object') {
                        // Merge timeLogs if remote has logs
                        if (Array.isArray(data.timeLogs) && data.timeLogs.length > 0) {
                            state.timeLogs = data.timeLogs;
                        }
                        if (typeof data.timerIsRunning === 'boolean') {
                            state.timerIsRunning = data.timerIsRunning;
                        }
                        if (data.currentIntervalStart) {
                            state.currentIntervalStart = data.currentIntervalStart;
                        }

                        state.timerTotalSeconds = calculateTodayTargetSeconds();
                        state.timerRemainingSeconds = calculateDailyRemainingSeconds();

                        saveStateLocally();
                        renderUI();
                        setStatus('online', 'Synced');
                        return;
                    }
                }
                setStatus('online', 'Ready');
            } catch(e) {
                setStatus('offline', 'Offline');
            }
        }

        function initCloudSync() {
            if (sseSource) {
                sseSource.close();
                sseSource = null;
            }
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            fetchInitialCloudState();

            const base = getCleanFirebaseUrl();
            if (!base) return;

            try {
                sseSource = new EventSource(`${base}/state.json`);
                sseSource.addEventListener('put', (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        if (parsed && parsed.data) {
                            const d = parsed.data;
                            if (Array.isArray(d.timeLogs)) {
                                state.timeLogs = d.timeLogs;
                            }
                            if (typeof d.timerIsRunning === 'boolean') {
                                state.timerIsRunning = d.timerIsRunning;
                            }
                            if (d.currentIntervalStart) {
                                state.currentIntervalStart = d.currentIntervalStart;
                            }
                            state.timerTotalSeconds = calculateTodayTargetSeconds();
                            state.timerRemainingSeconds = calculateDailyRemainingSeconds();
                            saveStateLocally();
                            renderUI();
                            setStatus('online', 'Synced');
                        }
                    } catch(err) {}
                });
                sseSource.onerror = () => {
                    setStatus('offline', 'Reconnecting');
                };
            } catch(e) {}
        }

        // Initial render and sync
        renderUI();
        initCloudSync();
    </script>
</body>
</html>
